version: 0.2

phases:
  install:
    commands:
      # Install Trivy (container vulnerability scanner)
      - curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
      # Install Checkov (IaC compliance scanner)
      - pip install checkov

  pre_build:
    commands:
      - aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin $ECR_REPO_URI
      - IMAGE_TAG=latest

  build:
    commands:
      # Scan container image for HIGH/CRITICAL CVEs — fails build if found
      - trivy image --exit-code 1 --severity CRITICAL --no-progress $ECR_REPO_URI:$IMAGE_TAG

      # Scan Terraform IaC files for misconfigurations
      - checkov -d . --framework terraform --output cli --soft-fail

      # Generate compliance reports
      - trivy image --format json --severity HIGH,CRITICAL --output trivy-report.json $ECR_REPO_URI:$IMAGE_TAG
      - checkov -d . --framework terraform --output json > checkov-report.json 2>&1 || true

reports:
  compliance-reports:
    files:
      - trivy-report.json
      - checkov-report.json
    discard-paths: yes

artifacts:
  files:
    - trivy-report.json
    - checkov-report.json
    - imagedefinitions.json
